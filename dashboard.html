<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | XII IPA 1</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
        <div class="logo-text">
          <span class="logo-title" id="siteName">XII IPA 1</span>
          <span class="logo-sub">Website Kelas Resmi</span>
        </div>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Beranda</a>
        <a href="pengumuman.html" class="nav-link"><i class="fas fa-bullhorn"></i> Pengumuman</a>
        <a href="chat.html" class="nav-link"><i class="fas fa-comments"></i> Chat</a>
        <a href="anggota.html" class="nav-link"><i class="fas fa-users"></i> Anggota</a>
        <a href="jadwal.html" class="nav-link"><i class="fas fa-calendar"></i> Jadwal</a>
      </div>
      <div class="nav-auth" id="navAuth"></div>
      <button class="mobile-toggle" id="mobileToggle"><i class="fas fa-bars"></i></button>
    </div>
  </nav>

  <div class="container" style="padding:32px 20px;">
    <div class="flex justify-between items-center mb-4" style="flex-wrap:wrap;gap:12px;">
      <div>
        <h1 style="font-size:1.5rem;font-weight:800;">Dashboard</h1>
        <p style="color:var(--text-muted);font-size:14px;">Halo, <strong id="dashName"></strong></p>
      </div>
      <span class="badge" id="dashRole" style="font-size:13px;padding:6px 14px;"></span>
    </div>

    <div class="dash-grid" id="dashStats"></div>

    <!-- Create Announcement (if allowed) -->
    <div id="createAnnSection" class="admin-section" style="display:none;">
      <h3><i class="fas fa-plus-circle"></i> Buat Pengumuman Baru</h3>
      <form id="annForm">
        <div class="form-group">
          <label>Judul</label>
          <input type="text" class="form-control" id="annTitle" required />
        </div>
        <div class="form-group">
          <label>Isi</label>
          <textarea class="form-control" id="annContent" required></textarea>
        </div>
        <div class="flex gap-2" style="flex-wrap:wrap;">
          <div class="form-group" style="flex:1;min-width:140px;">
            <label>Kategori</label>
            <select class="form-control" id="annCategory">
              <option value="umum">Umum</option>
              <option value="penting">Penting</option>
              <option value="tugas">Tugas</option>
              <option value="kegiatan">Kegiatan</option>
            </select>
          </div>
          <div class="form-group" style="display:flex;align-items:flex-end;padding-bottom:4px;">
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
              <input type="checkbox" id="annPinned" /> Pin pengumuman
            </label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-sm"><i class="fas fa-paper-plane"></i> Publikasikan</button>
      </form>
    </div>

    <!-- Recent announcements -->
    <div class="admin-section">
      <h3>Pengumuman Terbaru</h3>
      <div id="dashAnnList"></div>
    </div>

    <div class="cards-grid" style="margin-top:20px;">
      <a href="chat.html" class="card card-hover">
        <div class="card-icon green"><i class="fas fa-comments"></i></div>
        <h3>Chat Live</h3>
        <p>Public, Inbox & Private Developer</p>
      </a>
      <a href="pengumuman.html" class="card card-hover">
        <div class="card-icon blue"><i class="fas fa-bullhorn"></i></div>
        <h3>Semua Pengumuman</h3>
        <p>Lihat & kelola pengumuman</p>
      </a>
      <a href="anggota.html" class="card card-hover">
        <div class="card-icon purple"><i class="fas fa-users"></i></div>
        <h3>Anggota Kelas</h3>
        <p>Daftar anggota & struktur</p>
      </a>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-bottom" style="border:none;">
      <span>© <span id="year"></span> XII IPA 1</span>
      <span class="powered" id="poweredBy">Powered by Arzz</span>
    </div>
  </footer>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    var user = Auth.requireAuth();
    if (!user) throw new Error('not logged in');

    document.getElementById('year').textContent = new Date().getFullYear();
    renderNavbar();
    loadSiteSettings();

    document.getElementById('dashName').textContent = user.name;
    var roleEl = document.getElementById('dashRole');
    roleEl.textContent = Auth.roleLabel(user.role);
    roleEl.className = 'badge ' + Auth.roleBadgeClass(user.role);

    // Stats
    var anns = DB.getAnnouncements();
    var members = DB.getMembers();
    var msgs = DB.getAllMessages();
    document.getElementById('dashStats').innerHTML =
      '<div class="dash-card"><div class="icon" style="background:linear-gradient(135deg,#3b82f6,#2563eb)"><i class="fas fa-bullhorn"></i></div><div><h3>' + anns.length + '</h3><p>Pengumuman</p></div></div>' +
      '<div class="dash-card"><div class="icon" style="background:linear-gradient(135deg,#10b981,#059669)"><i class="fas fa-users"></i></div><div><h3>' + members.length + '</h3><p>Anggota</p></div></div>' +
      '<div class="dash-card"><div class="icon" style="background:linear-gradient(135deg,#8b5cf6,#7c3aed)"><i class="fas fa-comments"></i></div><div><h3>' + msgs.length + '</h3><p>Pesan Chat</p></div></div>' +
      '<div class="dash-card"><div class="icon" style="background:linear-gradient(135deg,#f59e0b,#d97706)"><i class="fas fa-shield-alt"></i></div><div><h3>' + Auth.roleLabel(user.role) + '</h3><p>Role Anda</p></div></div>';

    // Create ann
    if (Auth.canManageAnnouncements()) {
      document.getElementById('createAnnSection').style.display = 'block';
      document.getElementById('annForm').onsubmit = function (e) {
        e.preventDefault();
        DB.addAnnouncement({
          title: document.getElementById('annTitle').value.trim(),
          content: document.getElementById('annContent').value.trim(),
          authorId: user.id,
          authorName: user.name,
          role: user.role,
          category: document.getElementById('annCategory').value,
          pinned: document.getElementById('annPinned').checked
        });
        alert('Pengumuman berhasil dipublikasikan!');
        location.reload();
      };
    }

    // List
    var listEl = document.getElementById('dashAnnList');
    if (!anns.length) {
      listEl.innerHTML = '<div class="empty-state">Belum ada pengumuman</div>';
    } else {
      listEl.innerHTML = anns.slice(0, 5).map(function (a) {
        var canDel = Auth.hasRole('admin', 'developer') || a.authorId === user.id;
        return (
          '<div class="ann-item" style="margin-bottom:10px;">' +
            '<div class="flex justify-between items-center">' +
              '<div>' +
                '<div class="ann-meta">' +
                  (a.pinned ? '<span class="badge badge-pin">Pin</span>' : '') +
                  '<span class="badge ' + Auth.roleBadgeClass(a.role) + '">' + Auth.roleLabel(a.role) + '</span>' +
                '</div>' +
                '<h3 style="margin-top:4px;">' + escapeHtml(a.title) + '</h3>' +
                '<div class="ann-footer" style="margin-top:4px;"><span>' + formatDate(a.createdAt) + '</span></div>' +
              '</div>' +
              (canDel ? '<button class="btn btn-sm btn-danger" onclick="deleteAnn(\'' + a.id + '\')"><i class="fas fa-trash"></i></button>' : '') +
            '</div>' +
          '</div>'
        );
      }).join('');
    }

    function deleteAnn(id) {
      if (confirm('Hapus pengumuman ini?')) {
        DB.deleteAnnouncement(id);
        location.reload();
      }
    }
  </script>
</body>
</html>
