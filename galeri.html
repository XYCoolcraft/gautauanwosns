<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeri | XII IPA 1</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
        <div class="logo-text">
          <span class="logo-title" id="siteName">XII IPA 1</span>
          <span class="logo-sub">Website Kelas Resmi</span>
        </div>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Beranda</a>
        <a href="pengumuman.html" class="nav-link"><i class="fas fa-bullhorn"></i> Pengumuman</a>
        <a href="chat.html" class="nav-link"><i class="fas fa-comments"></i> Chat</a>
        <a href="anggota.html" class="nav-link"><i class="fas fa-users"></i> Anggota</a>
        <a href="jadwal.html" class="nav-link"><i class="fas fa-calendar"></i> Jadwal</a>
      </div>
      <div class="nav-auth" id="navAuth"></div>
      <button class="mobile-toggle" id="mobileToggle"><i class="fas fa-bars"></i></button>
    </div>
  </nav>

  <div class="page-header">
    <div class="icon-box" style="background:linear-gradient(135deg,#f43f5e,#e11d48)"><i class="fas fa-images"></i></div>
    <h1>Galeri Kelas</h1>
    <p>Momen berharga bersama teman sekelas</p>
  </div>

  <div class="container" style="padding-bottom:60px;">
    <div class="cards-grid" id="galleryGrid"></div>
    <p class="text-center" style="margin-top:28px;font-size:13px;color:#94a3b8;">
      Fitur upload foto tersedia di Admin Panel (segera diperluas).
    </p>
  </div>

  <footer class="footer">
    <div class="footer-bottom" style="border:none;">
      <span>© <span id="year"></span> XII IPA 1</span>
      <span class="powered" id="poweredBy">Powered by Arzz</span>
    </div>
  </footer>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    renderNavbar();
    loadSiteSettings();

    var items = [
      { title: 'Study Tour 2025', desc: 'Kunjungan ke museum sains' },
      { title: 'Lomba Cerdas Cermat', desc: 'Juara 1 tingkat sekolah' },
      { title: 'Praktikum Kimia', desc: 'Eksperimen di laboratorium' },
      { title: 'Class Meeting', desc: 'Acara akhir tahun ajaran' },
      { title: 'Bakti Sosial', desc: 'Kegiatan sosial di desa' },
      { title: 'Outing Class', desc: 'Belajar di luar kelas' }
    ];

    document.getElementById('galleryGrid').innerHTML = items.map(function (item) {
      return (
        '<div class="card card-hover" style="overflow:hidden;padding:0;">' +
          '<div style="aspect-ratio:16/10;background:linear-gradient(135deg,#f1f5f9,#e2e8f0);display:flex;align-items:center;justify-content:center;font-size:36px;color:#cbd5e1;">' +
            '<i class="fas fa-image"></i>' +
          '</div>' +
          '<div style="padding:16px;">' +
            '<h3 style="font-size:15px;">' + item.title + '</h3>' +
            '<p style="font-size:13px;color:var(--text-muted);margin-top:4px;">' + item.desc + '</p>' +
          '</div>' +
        '</div>'
      );
    }).join('');
  </script>
</body>
</html>
